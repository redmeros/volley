<ion-content class="ion-padding container">
    <ion-grid>
        <ion-row>
            <ion-col size="12" size-md="6" offset-md="3">
                <h1 class="ion-text-center">Turniej</h1>
            </ion-col>
        </ion-row>
    </ion-grid>
   <ion-accordion-group [multiple]="true">

        <ion-accordion value="general">
            <ion-item slot="header" color="light">
                <ion-icon name="trophy-outline" slot="start"></ion-icon>
                <ion-label>Ogólne</ion-label>
            </ion-item>
            <ion-card slot="content">
                <ion-card-content>
                    <app-tournament-general-settings [tournament]="tournament()"></app-tournament-general-settings>
                </ion-card-content>
            </ion-card>
        </ion-accordion>

        <ion-accordion value="courts">
            <ion-item slot="header" color="light">
                <ion-icon name="basketball-outline" slot="start"></ion-icon>
                <ion-label>Boiska</ion-label>
            </ion-item>
            <ion-card slot="content">
                <ion-card-content>
                </ion-card-content>
            </ion-card>
        </ion-accordion>

        <ion-accordion value="matches">
            <ion-item slot="header" color="light">
                <ion-icon name="calendar-outline" slot="start"></ion-icon>
                <ion-label>Mecze</ion-label>
            </ion-item>
            <ion-card slot="content">
                <ion-card-content>
                </ion-card-content>
            </ion-card>
        </ion-accordion>
        
        <ion-accordion value="results">
            <ion-item slot="header" color="light">
                <ion-icon name="create-outline" slot="start"></ion-icon>
                <ion-label>Wyniki</ion-label>
            </ion-item>
            <ion-card slot="content">
                <ion-card-content>
                </ion-card-content>
            </ion-card>
        </ion-accordion>

   </ion-accordion-group>
</ion-content>
