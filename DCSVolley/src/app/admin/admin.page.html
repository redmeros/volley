<ion-content [fullscreen]="true">
    <ion-card> 
        <ion-card-header>
            <ion-card-title>
                <div class="title">
                    <div>
                        Turnieje
                    </div>
                    <div>
                        <ion-button color="success" routerLink="/admin/tournament/new" (click)="addTournament($event)">
                            <ion-icon slot="start" name="add-outline"></ion-icon>
                            Dodaj
                        </ion-button>
                    </div>
                </div>
            </ion-card-title>
        </ion-card-header>

        <ion-card-content>
            <div class="tournament-cards">
            @for (tournament of availableTournaments() || []; track $index) {
                <ion-card class="tournament-card">
                    <ion-card-header>
                        <ion-card-title>
                           {{ tournament.name }} 
                        </ion-card-title>
                        <ion-card-subtitle>
                            {{ tournament.start_date | date: 'dd.MM.yyyy' }} - {{ tournament.end_date | date: 'dd.MM.yyyy' }}
                        </ion-card-subtitle>
                    </ion-card-header>

                    <ion-card-content>
                        {{ tournament.description }}
                    </ion-card-content>

                    <div class="tournament-card-buttons">
                        <ion-button fill="clear" color="danger">
                        <ion-icon slot="start" name="trash-outline"></ion-icon>
                        Usuń</ion-button>
                        <ion-button fill="clear">
                            <ion-icon slot="start" name="create-outline"></ion-icon>
                            Edytuj</ion-button>
                    </div>
                </ion-card>
            }
            </div>
            <!-- <ion-list lines="full"> 
                @for (tournament of availableTournaments() || []; track $index) {
                    <ion-item class="">
                        <div class="min-w-400px">
                        <a routerLink="/admin/tournament/">
                            <app-tournament class="min-w-400px" [model]="tournament"></app-tournament>
                        </a>
                        </div>
                    </ion-item>
                }
            </ion-list> -->
        </ion-card-content>
        
    </ion-card>
</ion-content>
